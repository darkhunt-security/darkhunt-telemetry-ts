name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default-deny — each job opts in to only what it needs.
permissions: {}

# Cancel in-flight runs when a new commit lands on the same branch / PR.
# Saves CI minutes and gives faster feedback on rapid push sequences.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Don't persist GITHUB_TOKEN in .git/config — defense-in-depth.
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@darkhunt-security'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Verify lockfile integrity
        # Catches accidental package.json/lockfile drift, AND any malicious dep
        # that mutates the lockfile during install.
        run: |
          git diff --exit-code package-lock.json || {
            echo "::error::package-lock.json was modified during install"
            exit 1
          }

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Code quality / security analysis runs via SonarCloud Automatic Analysis
      # (the SonarQube Cloud GitHub App scans pushes and PRs directly — no CI
      # scanner step and no SONAR_TOKEN secret required).

  publish:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@darkhunt-security'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Verify lockfile integrity
        # Must run BEFORE the `npm version` step below — that step
        # legitimately mutates package-lock.json, so the integrity check
        # has to happen against the unmutated post-install state.
        run: |
          git diff --exit-code package-lock.json || {
            echo "::error::package-lock.json was modified during install"
            exit 1
          }

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(jq -r .version package.json)
          BASE_VERSION="${BASE_VERSION%%-*}"
          echo "version=${BASE_VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build version
        run: |
          echo "::notice title=Build Version::${{ steps.version.outputs.version }}"
          echo "VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      # Built with jq into a file rather than interpolated into the action's inline
      # YAML `payload`. A merge commit's message is multi-line, and the blank line
      # between its subject and body is not legal continuation inside a quoted YAML
      # scalar — so the payload silently failed to parse and 0.5.5-build.163 shipped
      # unannounced. Values arrive via env (never `${{ }}` inside the script) and jq
      # does the escaping, so a quote or newline in a commit message is just data.
      - name: Compose Slack payload
        env:
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg version "$VERSION" \
            --arg url "$COMMIT_URL" \
            --arg subject "${COMMIT_MSG%%$'\n'*}" \
            --arg actor "$ACTOR" \
            '{text: "*\($repo)* released `\($version)`\n• Commit: <\($url)|\($subject)>\n• Published by: \($actor)"}' \
            > "$RUNNER_TEMP/slack-payload.json"

      - name: Notify Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          webhook-type: incoming-webhook
          # Defaults to "false", which is how the parse failure above went unnoticed:
          # the step swallowed the error and reported success. A release that cannot
          # announce itself should fail loudly — the publish has already happened by
          # this point, so this cannot leave a half-published package.
          errors: true
          payload-file-path: ${{ runner.temp }}/slack-payload.json
