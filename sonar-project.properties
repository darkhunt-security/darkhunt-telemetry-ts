# SonarCloud project configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/
#
# Analysis runs via SonarCloud Automatic Analysis (the SonarQube Cloud GitHub
# App scans pushes and PRs directly). There is no CI scanner step and no
# SONAR_TOKEN secret — Automatic Analysis reads this file for configuration.
# Project + organization keys are public information (visible in the SonarCloud
# project URL) — fine to commit here.
sonar.projectKey=darkhunt-security_darkhunt-telemetry-ts
sonar.organization=darkhunt-ai
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=test

# --- Test coverage ---
# NOTE: SonarCloud Automatic Analysis does NOT import external coverage reports
# (lcov), so coverage is not published to the dashboard under this setup. Run
# `npm run test:coverage` locally to inspect coverage. If coverage on the
# dashboard is required, switch back to CI-based analysis (scanner step +
# SONAR_TOKEN) — Automatic Analysis and lcov import are mutually exclusive.
